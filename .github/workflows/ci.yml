# The complete local gate (scripts/check.sh, docs/operations/local-checks.md) split into parallel jobs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (lint, types, drift, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the handbook coverage check diffs against the PR base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run python scripts/export_admin_error_codes.py --check
      - run: uv run python scripts/check_handbook.py --check
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run python scripts/check_handbook.py --check --base "origin/$BASE_REF"
      # PostgreSQL comes from a testcontainer (tests/pg_harness.py); the runner has Docker.
      - run: uv run pytest -q -n 4 --durations=20 --cov=ontotator --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  mcp:
    name: MCP server (lint, types, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The integration test needs ONTOTATOR_TEST_PG_URL and is skipped here.
      - run: uv run pytest -q

  frontend:
    name: Frontend (types, API drift, vitest, bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run api:check
      - run: npm --prefix frontend run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - run: npm --prefix frontend run build
      - name: Embedded bundle matches the build
        run: diff -r frontend/dist src/ontotator/web

  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Builds the frontend, then runs all specs against tests/browser_server.py (testcontainer PostgreSQL).
      - run: npm --prefix frontend run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  wheel:
    name: Wheel (lock and contents)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_wheel.py --out-dir build/check-wheel
