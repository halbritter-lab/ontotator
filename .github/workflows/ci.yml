name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        node-version: ["20"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Check API drift
        run: npm --prefix frontend run api:check

      - name: Run frontend unit tests
        run: npm --prefix frontend test

      - name: Build frontend production bundle
        run: npm --prefix frontend run build

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Check OpenAPI schema drift
        run: uv run python scripts/export_openapi.py --check

      - name: Install browser test runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests against the Python backend
        run: npm --prefix frontend run test:e2e

      - name: Ruff linter check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy typecheck
        run: uv run mypy src

      - name: Run backend test suite
        run: uv run pytest -v

      - name: Verify release build pipeline
        run: uv run python scripts/build_release.py
