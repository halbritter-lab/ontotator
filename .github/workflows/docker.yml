# Builds the production image; publishes it to GHCR on version tags (scripts/publish-image.sh is the manual path).
name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - src/**
      - frontend/**
      - docker/**
      - .github/workflows/docker.yml
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/halbritter-lab/ontotator

jobs:
  build:
    name: Build and smoke test
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          load: true
          push: false
          tags: ontotator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm ontotator:ci --help

  publish:
    name: Build and push to GHCR
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # {{version}} strips the v, matching publish-image.sh's VERSION tags (0.4.0).
          # latest=auto adds latest only for non-prerelease semver tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
          flavor: latest=auto
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest reference for ONTOTATOR_IMAGE
        run: echo "ONTOTATOR_IMAGE=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
