# Builds and smoke-tests the production image on pull requests; publishing lives in docker-publish.yml.
name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - src/**
      - frontend/**
      - docker/**
      - docs/handbook/**
      - .github/workflows/docker.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          load: true
          push: false
          tags: ontotator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm ontotator:ci --help
