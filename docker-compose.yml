# Deploy behind an external HTTPS proxy joined to the edge network.
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *runtime
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: "70:70"
    environment:
      POSTGRES_DB: ontocurator
      POSTGRES_USER: ontocurator_bootstrap
      POSTGRES_PASSWORD_FILE: /run/postgres/bootstrap-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./secrets/postgres:/run/postgres:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-ontocurator.sh:ro
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=16m,uid=70,gid=70
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: [CMD, pg_isready, -U, ontocurator_bootstrap, -d, ontocurator]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]

  migrate:
    <<: *runtime
    image: ${ONTOCURATOR_IMAGE:?Set the verified image}
    command: [db, upgrade]
    restart: "no"
    environment:
      ONTOCURATOR_MIGRATION_DATABASE_URL: postgresql://ontocurator_owner@postgres:5432/ontocurator
      ONTOCURATOR_MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/owner-password
    volumes:
      - ./secrets/migrate:/run/secrets:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # The image's HTTP healthcheck does not apply to a one-shot CLI.
    healthcheck:
      disable: true
    networks: [backend]

  app:
    <<: *runtime
    image: ${ONTOCURATOR_IMAGE:?Set the verified image}
    init: false # The image already runs tini as PID 1.
    environment:
      ONTOCURATOR_ENV: production
      ONTOCURATOR_PUBLIC_ORIGIN: ${ONTOCURATOR_PUBLIC_ORIGIN:?Set the public HTTPS origin}
      ONTOCURATOR_TRUSTED_PROXIES: ${ONTOCURATOR_TRUSTED_PROXIES:?Set the exact proxy peer addresses}
      ONTOCURATOR_WORKERS: ${ONTOCURATOR_WORKERS:-2}
      ONTOCURATOR_DATABASE_URL: postgresql://ontocurator_app@postgres:5432/ontocurator
      ONTOCURATOR_DATABASE_PASSWORD_FILE: /run/secrets/app-password
      ONTOCURATOR_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin-password-hash
      ONTOCURATOR_DATA_DIR: /data
    volumes:
      - ontocurator-data:/data
      - ./secrets/app:/run/secrets:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 35s
    # /readyz healthcheck is inherited from the verified image.
    networks: [edge, backend]

volumes:
  postgres-data:
  ontocurator-data:

networks:
  edge:
    name: ${ONTOCURATOR_EDGE_NETWORK:-ontocurator-edge}
  backend:
    internal: true
