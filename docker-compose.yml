# Deploy behind Nginx Proxy Manager on its shared external network; NPM forwards to
# http://ontotator_app:8000. See docs/operations.md.
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  ontotator_postgres:
    <<: *runtime
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: "70:70"
    environment:
      POSTGRES_DB: ontotator
      POSTGRES_USER: ontotator_bootstrap
      POSTGRES_PASSWORD_FILE: /run/postgres/bootstrap-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./secrets/postgres:/run/postgres:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-ontotator.sh:ro
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=16m,uid=70,gid=70
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: [CMD, pg_isready, -U, ontotator_bootstrap, -d, ontotator]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]

  migrate:
    <<: *runtime
    image: ${ONTOTATOR_IMAGE:?Set the verified image}
    command: [db, upgrade]
    restart: "no"
    environment:
      ONTOTATOR_MIGRATION_DATABASE_URL: postgresql://ontotator_owner@ontotator_postgres:5432/ontotator
      ONTOTATOR_MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/owner-password
    volumes:
      - ./secrets/migrate:/run/secrets:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      ontotator_postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # The image's HTTP healthcheck does not apply to a one-shot CLI.
    healthcheck:
      disable: true
    networks: [backend]

  ontotator_app:
    <<: *runtime
    image: ${ONTOTATOR_IMAGE:?Set the verified image}
    init: false # The image already runs tini as PID 1.
    environment:
      ONTOTATOR_ENV: production
      ONTOTATOR_PUBLIC_ORIGIN: ${ONTOTATOR_PUBLIC_ORIGIN:?Set the public HTTPS origin}
      ONTOTATOR_TRUSTED_PROXIES: ${ONTOTATOR_TRUSTED_PROXIES:?Set the exact proxy peer addresses}
      ONTOTATOR_WORKERS: ${ONTOTATOR_WORKERS:-2}
      ONTOTATOR_DATABASE_URL: postgresql://ontotator_app@ontotator_postgres:5432/ontotator
      ONTOTATOR_DATABASE_PASSWORD_FILE: /run/secrets/app-password
      ONTOTATOR_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin-password-hash
      ONTOTATOR_DATA_DIR: /data
    volumes:
      - ontotator-data:/data
      - ./secrets/app:/run/secrets:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      ontotator_postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 35s
    # /readyz healthcheck is inherited from the verified image.
    # Prefixed service name: NPM and other stacks on the shared network may have an app.
    networks: [backend, npm_proxy_network]

volumes:
  postgres-data:
  ontotator-data:

networks:
  backend:
    internal: true
  npm_proxy_network:
    external: true
    name: ${NPM_SHARED_NETWORK_NAME:?Set the external Nginx Proxy Manager network}
