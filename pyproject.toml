[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpo-editor"
version = "0.1.0"
description = "Local application for annotating and reviewing HPO annotations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "rfc8785>=0.1,<1",
    "scikit-learn>=1.4,<2",
    "typer>=0.12,<1",
    "uvicorn>=0.28,<1",
]

[project.scripts]
hpo-editor = "hpo_editor.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hpo_editor"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hpo_editor"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true
