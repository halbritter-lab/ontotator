[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontocurator"
version = "0.1.0"
description = "Secure offline editor for ontology annotation and origin-neutral review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.110,<1",
    "numpy>=1.26,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-multipart>=0.0.9",
    "rfc8785>=0.1,<1",
    "scikit-learn>=1.4,<2",
    "sqlalchemy>=2.0.36,<2.1",
    "typer>=0.12,<1",
    "uvicorn>=0.28,<1",
]

[project.scripts]
ontocurator = "ontocurator.cli:main"
onto-curator = "ontocurator.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "testcontainers[postgres]>=4.9,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontocurator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ontocurator"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true
