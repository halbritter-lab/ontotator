[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontotator"
version = "0.1.0"
description = "Secure offline editor for ontology annotation and origin-neutral review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.110,<1",
    "numpy>=1.26,<3",
    "ontospan @ git+https://github.com/halbritter-lab/ontospan.git@311f93e03b0c18b1fdcbb85e015dc02d246bce7a",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-multipart>=0.0.9",
    "rfc8785>=0.1,<1",
    "scikit-learn>=1.4,<2",
    "sqlalchemy>=2.0.36,<2.1",
    "typer>=0.12,<1",
    "uvicorn>=0.28,<1",
]

[project.scripts]
ontotator = "ontotator.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "locust>=2.32,<3",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9,<1",
    "testcontainers[postgres]>=4.9,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontotator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ontotator"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ontospan ships no py.typed marker; its sources are fully annotated.
module = ["ontospan", "ontospan.*"]
follow_untyped_imports = true

[tool.hatch.metadata]
# ontospan is a Git dependency pinned to a commit (T2 index D-n).
allow-direct-references = true
